<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Enhanced viewport for mobile/tablet optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Lifty - A pixel-art horror game about surviving a falling lift"
    />
    <title>Lifty - Pixel Horror Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      body {
        background: #000;
        font-family: 'Press Start 2P', monospace;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0;
        overflow-x: hidden;
      }
      
      canvas {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        touch-action: none;
        max-width: 100%;
      }
      
      /* Prevent any horizontal overflow */
      * {
        max-width: 100%;
      }
      
      /* Mobile-specific optimizations */
      @media (max-width: 768px) {
        body {
          font-size: 10px;
        }
        #root {
          align-items: flex-start;
          padding-top: 10px;
        }
      }
      
      @media (max-width: 480px) {
        body {
          font-size: 8px;
        }
        #root {
          padding-top: 5px;
        }
      }
      
      /* Prevent pull-to-refresh on mobile */
      @media (hover: none) and (pointer: coarse) {
        body {
          overscroll-behavior-y: contain;
        }
      }
      
      /* Landscape orientation optimization for mobile */
      @media (max-width: 926px) and (orientation: landscape) {
        body {
          align-items: flex-start;
          padding-top: 0;
        }
      }
      
      /* Handle notch/safe areas on modern devices */
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
