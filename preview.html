<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Preview - Video Output</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }
        
        #controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            height: 36px;
            flex-wrap: wrap;
        }
        
        #controls h1 {
            font-size: 12px;
            font-weight: 600;
            color: #cccccc;
            margin: 0;
            white-space: nowrap;
        }
        
        #controls button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        
        #controls .compact-btn {
            background: #2d2d30;
            padding: 3px 6px;
        }
        
        #controls button:hover {
            background: #1177bb;
        }
        
        #controls button:active {
            background: #0d5a8f;
        }
        
        #controls .status {
            margin-left: auto;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 3px;
            background: #1a1a1a;
            white-space: nowrap;
        }
        
        #controls.minimized {
            height: 28px;
            padding: 4px 8px;
        }
        
        #controls.minimized h1 {
            font-size: 11px;
        }
        
        #controls.minimized button {
            padding: 2px 6px;
            font-size: 10px;
        }
        
        .toggle-size {
            background: transparent !important;
            border: 1px solid #3c3c3c;
            padding: 2px 6px !important;
            font-size: 10px !important;
        }
        
        #controls .status.loading {
            color: #ffa500;
        }
        
        #controls .status.ready {
            color: #4ec9b0;
        }
        
        #controls .status.error {
            color: #f48771;
        }
        
        #preview-container {
            position: absolute;
            top: 36px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1e1e1e;
        }
        
        #controls.minimized ~ #preview-container {
            top: 28px;
        }
        
        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #cccccc;
        }
        
        #loading-message .spinner {
            border: 3px solid #3c3c3c;
            border-top: 3px solid #0e639c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive design for narrow viewports */
        @media (max-width: 600px) {
            #controls h1 {
                display: none;
            }
            
            #controls {
                gap: 6px;
                padding: 4px 8px;
                height: 32px;
            }
            
            #preview-container {
                top: 32px;
            }
        }
        
        @media (max-width: 400px) {
            #controls button {
                padding: 3px 6px;
                font-size: 10px;
            }
            
            #controls .status {
                font-size: 9px;
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>🎬 Video Output</h1>
        <button onclick="reloadPreview()" title="Reload preview">↻</button>
        <button onclick="openInBrowser()" title="Open in browser">🌐</button>
        <button onclick="toggleDevTools()" title="DevTools info" class="compact-btn">🔧</button>
        <button onclick="toggleControlsSize()" class="toggle-size" title="Toggle compact mode">⇕</button>
        <div id="status" class="status loading">Loading...</div>
    </div>
    
    <div id="preview-container">
        <div id="loading-message">
            <div class="spinner"></div>
            <p>Waiting for development server...</p>
            <p style="font-size: 12px; color: #858585; margin-top: 10px;">
                Make sure to run: <code style="background: #2d2d30; padding: 2px 6px; border-radius: 3px;">npm run dev:full</code>
            </p>
        </div>
        <iframe id="preview-frame" style="display: none;"></iframe>
    </div>
    
    <script>
        const previewUrl = 'http://localhost:5173';
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading-message');
        const frameEl = document.getElementById('preview-frame');
        
        let checkAttempts = 0;
        const maxAttempts = 60; // 60 seconds
        
        function updateStatus(message, className) {
            statusEl.textContent = message;
            statusEl.className = `status ${className}`;
        }
        
        async function checkServer() {
            try {
                const response = await fetch(previewUrl, { 
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                
                // If we get here without error, server is probably up
                loadPreview();
                return true;
            } catch (error) {
                checkAttempts++;
                
                if (checkAttempts >= maxAttempts) {
                    updateStatus('Server not responding', 'error');
                    loadingEl.innerHTML = `
                        <div class="spinner" style="display: none;"></div>
                        <p style="color: #f48771;">❌ Development server not responding</p>
                        <p style="font-size: 12px; color: #858585; margin-top: 10px;">
                            Please run: <code style="background: #2d2d30; padding: 2px 6px; border-radius: 3px;">npm run dev:full</code>
                        </p>
                        <button onclick="checkServer()" style="margin-top: 15px; background: #0e639c; color: white; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer;">
                            Retry
                        </button>
                    `;
                    return false;
                }
                
                updateStatus(`Checking server... (${checkAttempts}/${maxAttempts})`, 'loading');
                setTimeout(checkServer, 1000);
                return false;
            }
        }
        
        function loadPreview() {
            frameEl.src = previewUrl;
            frameEl.style.display = 'block';
            loadingEl.style.display = 'none';
            updateStatus('✓ Server Ready', 'ready');
            
            // Monitor iframe load
            frameEl.onload = () => {
                updateStatus('✓ App Loaded', 'ready');
            };
            
            frameEl.onerror = () => {
                updateStatus('Error loading app', 'error');
            };
        }
        
        function reloadPreview() {
            updateStatus('Reloading...', 'loading');
            frameEl.contentWindow?.location.reload();
            setTimeout(() => {
                updateStatus('✓ Reloaded', 'ready');
            }, 500);
        }
        
        function openInBrowser() {
            window.open(previewUrl, '_blank');
        }
        
        function toggleDevTools() {
            // This is a placeholder - in VS Code, you'd use the command palette
            alert('To open DevTools:\n\n1. Right-click the preview\n2. Select "Inspect Element"\n\nOr use: Ctrl+Shift+I (Windows/Linux) or Cmd+Option+I (Mac)');
        }
        
        function toggleControlsSize() {
            const controls = document.getElementById('controls');
            controls.classList.toggle('minimized');
            
            // Save preference
            const isMinimized = controls.classList.contains('minimized');
            localStorage.setItem('previewControlsMinimized', isMinimized);
        }
        
        // Restore controls size preference
        if (localStorage.getItem('previewControlsMinimized') === 'true') {
            document.getElementById('controls').classList.add('minimized');
        }
        
        // Auto-refresh every 30 seconds to keep connection alive
        setInterval(() => {
            if (frameEl.style.display !== 'none') {
                // Ping to keep alive
                fetch(previewUrl, { method: 'HEAD', mode: 'no-cors' }).catch(() => {});
            }
        }, 30000);
        
        // Start checking for server
        checkServer();
    </script>
</body>
</html>
